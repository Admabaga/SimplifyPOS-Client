<!--
  Variante knockout del logo: sólo la marca, sin la teja verde oscura.
  Se usa sobre superficies oscuras (sidebar, hero del login, overlay de logout),
  donde la teja del icono completo se confundiría con el fondo.
  El icono con teja (logo.svg) se reserva para fondos claros y para el favicon.
-->
