<!--
  Variante monocroma para impresión térmica (tickets 80mm).
  Las térmicas son 1 bit: no hay grises, cualquier opacidad se convierte en
  trama sucia. Por eso aquí las barras "apagadas" van en contorno en vez de
  relleno translúcido, y todo es negro puro sobre blanco.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 108 312 312" width="312" height="312">
  <g fill="none" stroke="#000" stroke-width="16">
    <rect x="128" y="338" width="36" height="58" rx="18"></rect>
    <rect x="238" y="296" width="36" height="100" rx="18"></rect>
  </g>
  <rect x="340" y="222" width="52" height="182" rx="26" fill="#000"></rect>
  <path d="M120 302 L184 240 L246 280 L362 166" fill="none" stroke="#000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"></path>
  <path d="M404 124 L379 197 L331 149 Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"></path>
</svg>
